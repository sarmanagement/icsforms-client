name: Release Executable JAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  headless:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify headless suite
        run: mvn -B -ntp verify -Djava.awt.headless=true

      - name: Report skipped tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          skipped = 0
          for report in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              skipped += sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"### Headless test summary\n\nSkipped tests: **{skipped}**\n")
          PY

  displayed:
    name: Displayed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify displayed suite
        run: xvfb-run -a -s '-screen 0 1280x800x24' mvn -B -ntp verify -Dicsforms.desktopTests=true -Djava.awt.headless=false

      - name: Report skipped tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/surefire-reports/TEST-*.xml")
          skipped = 0
          failures = []
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              skipped += sum(int(suite.attrib.get("skipped", "0")) for suite in suites)

          with open("src/test/resources/displayed-test-baseline.txt", encoding="utf-8") as baseline:
              for class_name in (line.strip() for line in baseline if line.strip()):
                  report = "target/surefire-reports/TEST-" + class_name + ".xml"
                  if not os.path.exists(report):
                      failures.append(f"Missing displayed-test report: `{class_name}`")
                      continue
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
                  class_skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
                  if class_skipped:
                      failures.append(f"`{class_name}` skipped {class_skipped} test(s)")

          summary = f"### Displayed test summary\n\nSkipped tests: **{skipped}**\n\n"
          summary += "Displayed-test baseline: 28 classes; all reports must be present with zero skipped tests.\n"
          if failures:
              summary += "\n**Displayed-test gate failures:**\n" + "\n".join(f"- {failure}" for failure in failures) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY

  build-and-release:
    needs: [headless, displayed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package verified release
        run: mvn -B -ntp clean package -DskipTests

      - name: Locate shaded jar
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "original-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" | head -n 1)
          echo "path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
